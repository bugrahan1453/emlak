<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Radar dairesi -->
  <circle cx="24" cy="24" r="18" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.3"/>
  <circle cx="24" cy="24" r="11" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
  <circle cx="24" cy="24" r="4" fill="#00d4ff"/>

  <!-- Radar sweep -->
  <line x1="24" y1="24" x2="24" y2="6" stroke="#00ff88" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Nokta (sinyal) -->
  <circle cx="35" cy="14" r="2.5" fill="#00ff88" opacity="0.9"/>
  <circle cx="35" cy="14" r="5" stroke="#00ff88" stroke-width="1" opacity="0.4"/>

  <!-- Yazı: EmlakRadar -->
  <text x="52" y="20" font-family="'Outfit', 'Arial', sans-serif" font-size="16" font-weight="700" fill="#e2e8f0" letter-spacing="-0.3">Emlak</text>
  <text x="52" y="38" font-family="'Outfit', 'Arial', sans-serif" font-size="16" font-weight="700" fill="#00d4ff" letter-spacing="-0.3">Radar</text>

  <!-- Pro etiketi -->
  <rect x="138" y="26" width="28" height="14" rx="4" fill="rgba(0,212,255,0.15)" stroke="rgba(0,212,255,0.3)" stroke-width="1"/>
  <text x="152" y="37" font-family="'Outfit', 'Arial', sans-serif" font-size="9" font-weight="700" fill="#00d4ff" text-anchor="middle" letter-spacing="0.5">PRO</text>
</svg>
