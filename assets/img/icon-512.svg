<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="100" fill="#060a1a"/>
  <!-- Background glow -->
  <radialGradient id="g1" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#060a1a" stop-opacity="0"/>
  </radialGradient>
  <circle cx="256" cy="256" r="220" fill="url(#g1)"/>
  <!-- Radar rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.1"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.18"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#00d4ff" stroke-width="3" opacity="0.3"/>
  <circle cx="256" cy="256" r="60"  fill="none" stroke="#00d4ff" stroke-width="3" opacity="0.5"/>
  <circle cx="256" cy="256" r="20"  fill="none" stroke="#00d4ff" stroke-width="3" opacity="0.7"/>
  <!-- Center -->
  <circle cx="256" cy="256" r="10" fill="#00d4ff"/>
  <!-- Sweep -->
  <line x1="256" y1="256" x2="410" y2="110" stroke="#00d4ff" stroke-width="4" opacity="0.75" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="385" y2="130" stroke="#00d4ff" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <!-- Tick marks -->
  <line x1="256" y1="24"  x2="256" y2="52"  stroke="#00d4ff" stroke-width="3" opacity="0.35"/>
  <line x1="488" y1="256" x2="460" y2="256" stroke="#00d4ff" stroke-width="3" opacity="0.35"/>
  <line x1="256" y1="488" x2="256" y2="460" stroke="#00d4ff" stroke-width="3" opacity="0.35"/>
  <line x1="24"  y1="256" x2="52"  y2="256" stroke="#00d4ff" stroke-width="3" opacity="0.35"/>
  <!-- Blip dots -->
  <circle cx="390" cy="126" r="12" fill="#00ff88" opacity="0.9"/>
  <circle cx="360" cy="152" r="8"  fill="#00ff88" opacity="0.55"/>
  <circle cx="320" cy="185" r="5"  fill="#00ff88" opacity="0.3"/>
  <!-- Label -->
  <text x="256" y="320" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="28" font-weight="700" fill="#00d4ff" letter-spacing="3" opacity="0.8">EMLAKRADAR</text>
  <text x="256" y="348" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16" font-weight="400" fill="#7a8599" letter-spacing="4">PRO</text>
</svg>
