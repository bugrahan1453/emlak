version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: emlakradar-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: emlakradar-flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Istanbul
    ports:
      - "8191:8191"
    restart: unless-stopped

  scraper:
    build: .
    container_name: emlakradar-scraper
    depends_on:
      redis:
        condition: service_healthy
      flaresolverr:
        condition: service_started
    env_file: .env
    environment:
      - REDIS_HOST=redis
    ports:
      - "3001:3001"
    volumes:
      - ./logs:/app/logs
      - /dev/shm:/dev/shm
    restart: unless-stopped
    shm_size: '2gb'
    cap_add:
      - SYS_ADMIN

volumes:
  redis-data:
