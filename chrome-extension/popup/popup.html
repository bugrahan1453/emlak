<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>EmlakRadar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #0f1117;
      color: #e2e8f0;
    }

    .header {
      background: linear-gradient(135deg, #1a1f2e, #232b3e);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #2d3748;
    }
    .header h1 { font-size: 15px; font-weight: 600; flex: 1; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 500;
    }
    .badge.running  { background: #1a3050; color: #63b3ed; animation: pulse 1.5s infinite; }
    .badge.done     { background: #1a3a2a; color: #68d391; }
    .badge.idle     { background: #2d3748; color: #718096; }
    .badge.error    { background: #3a1a1a; color: #fc8181; }
    .badge::before  { content: '●'; font-size: 8px; }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 1px;
      background: #2d3748;
      border-bottom: 1px solid #2d3748;
    }
    .stat { background: #1a1f2e; padding: 10px 14px; }
    .stat .label { font-size: 10px; color: #718096; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat .value { font-size: 14px; font-weight: 700; color: #a0aec0; margin-top: 2px; }
    .stat .value.green { color: #68d391; }

    /* Canlı Log */
    .log-box {
      background: #0d1117;
      border-bottom: 1px solid #1e2535;
      padding: 10px 14px;
      min-height: 52px;
    }
    .log-label { font-size: 10px; color: #4a5568; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
    .log-text {
      font-size: 11px;
      color: #a0aec0;
      line-height: 1.5;
      word-break: break-word;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .log-text.ok    { color: #68d391; }
    .log-text.error { color: #fc8181; }
    .log-text.done  { color: #f6ad55; }

    /* Ayarlar */
    .section {
      padding: 12px 16px;
      border-bottom: 1px solid #1e2535;
    }
    .section-title {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px;
      color: #4a5568; margin-bottom: 8px; font-weight: 600;
    }
    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    .form-row:last-child { margin-bottom: 0; }
    label.fl { font-size: 11px; color: #718096; white-space: nowrap; }

    input[type="text"], input[type="number"] {
      background: #1e2535; border: 1px solid #2d3748; border-radius: 5px;
      padding: 5px 8px; color: #e2e8f0; font-size: 12px; outline: none;
      flex: 1; min-width: 0;
    }
    input:focus { border-color: #4299e1; }

    /* Buttons */
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 12px 16px;
    }

    button {
      padding: 9px 12px; border: none; border-radius: 6px;
      font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.15s;
      letter-spacing: 0.2px;
    }
    #scrape-btn { background: #276749; color: #fff; }
    #scrape-btn:hover { background: #38a169; }
    #stop-btn  { background: #742a2a; color: #fff; display:none; }
    #stop-btn:hover  { background: #9b2c2c; }
    #save-btn { background: #2b4a7a; color: #fff; }
    #save-btn:hover { background: #3182ce; }
    #clear-btn { background: #4a2010; color: #fc8181; font-size: 11px; }
    #clear-btn:hover { background: #742a2a; color: #fff; }

    .footer {
      padding: 6px 16px;
      font-size: 10px;
      color: #2d3748;
      border-top: 1px solid #1e2535;
      text-align: center;
    }
    .footer a { color: #4a5568; text-decoration: none; }

    .error-banner {
      margin: 0 14px 8px;
      background: #3a1a1a; border: 1px solid #742a2a; border-radius: 5px;
      padding: 7px 10px; font-size: 11px; color: #fc8181; word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🏠 EmlakRadar</h1>
    <span id="status-badge" class="badge idle">Bekliyor</span>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="label">Son Tarama</div>
      <div class="value" id="last-time">—</div>
    </div>
    <div class="stat">
      <div class="label">Yeni İlan</div>
      <div class="value green" id="last-count">—</div>
    </div>
    <div class="stat">
      <div class="label">Önbellekte</div>
      <div class="value" id="seen-count">—</div>
    </div>
    <div class="stat">
      <div class="label">Son Hata</div>
      <div class="value" id="err-short" style="font-size:10px;color:#fc8181;word-break:break-all">—</div>
    </div>
  </div>

  <div class="log-box">
    <div class="log-label">Durum</div>
    <div class="log-text" id="log-text">Hazır — Tara butonuna basın</div>
  </div>

  <div id="error-area"></div>

  <div id="session-banner" style="display:none;margin:0 14px 0;background:#2a1a00;border:1px solid #b7791f;border-radius:5px;padding:6px 10px;font-size:11px;color:#f6ad55;margin-bottom:0;"></div>

  <div class="section">
    <div class="section-title">Site Durumu</div>
    <div id="site-status" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
  </div>

  <div class="section">
    <div class="section-title">Ayarlar</div>
    <div class="form-row">
      <label class="fl">Şehirler</label>
      <input type="text" id="cities" placeholder="canakkale,istanbul">
    </div>
    <div class="form-row">
      <label class="fl">Aralık (dk)</label>
      <input type="number" id="intervalMinutes" min="5" max="120" style="max-width:70px;">
    </div>
    <div class="form-row">
      <label class="fl">Gün aralığı <span style="color:#4a5568">(0=tümü)</span></label>
      <input type="number" id="gunAraligi" min="0" max="365" style="max-width:70px;" title="0=filtre yok (başlangıç), 1=bugün/dün, 7=son hafta">
    </div>
  </div>

  <div class="section">
    <div class="section-title">CAPTCHA Çözücü <span style="color:#4a5568;font-weight:normal">(opsiyonel)</span></div>
    <div class="form-row">
      <label class="fl">Servis</label>
      <select id="captchaSolver" style="background:#1e2535;border:1px solid #2d3748;border-radius:5px;padding:5px 8px;color:#e2e8f0;font-size:12px;flex:1;outline:none;">
        <option value="">Kapalı</option>
        <option value="capmonster">CapMonster (~₺0.5/1000)</option>
        <option value="capsolver">CapSolver (~₺25/1000)</option>
        <option value="2captcha">2Captcha (~₺75/1000)</option>
      </select>
    </div>
    <div class="form-row">
      <label class="fl">API Key</label>
      <input type="text" id="captchaApiKey" placeholder="API anahtarınız">
    </div>
    <div class="form-row" id="captcha-test-row" style="display:none;">
      <label class="fl"></label>
      <button id="captcha-test-btn" style="background:#1e2535;border:1px solid #2d3748;color:#a0aec0;font-size:11px;padding:4px 10px;border-radius:4px;cursor:pointer;">Key Test Et</button>
      <span id="captcha-test-result" style="font-size:11px;margin-left:8px;"></span>
    </div>
  </div>

  <div class="buttons">
    <button id="scrape-btn">▶ Şimdi Tara</button>
    <button id="stop-btn">⏹ Durdur</button>
    <button id="save-btn">💾 Kaydet</button>
    <button id="clear-btn" style="grid-column:1/-1">🗑 Önbelleği Temizle (tüm ilanları yeniden tara)</button>
    <button id="errorlog-btn" style="grid-column:1/-1;background:#1a1f2e;border:1px solid #2d3748;color:#718096;font-size:11px;">📋 Hata Kaydı</button>
  </div>

  <div id="errorlog-area" style="display:none;padding:8px 14px;font-size:10px;background:#0d1117;border-top:1px solid #1e2535;max-height:120px;overflow-y:auto;">
    <div style="color:#4a5568;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px;">Son Hatalar</div>
    <div id="errorlog-list"></div>
  </div>

  <div class="footer">hetagayrimenkul.com · EmlakRadar v2.0</div>

  <script src="popup.js"></script>
</body>
</html>
