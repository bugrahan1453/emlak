<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px; min-height: 480px;
      background: #0f1117; color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
    }
    .header {
      background: linear-gradient(135deg, #1a1f2e, #141824);
      padding: 14px 16px;
      border-bottom: 1px solid #2d3748;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { font-size: 15px; font-weight: 700; color: #63b3ed; }
    .logo span { color: #68d391; }
    .badge {
      font-size: 10px; padding: 2px 8px; border-radius: 20px;
      background: #2d3748; color: #a0aec0;
    }
    .badge.aktif { background: #1c3a2a; color: #68d391; }
    .badge.calisiyor { background: #1a2a4a; color: #63b3ed; animation: blink 1.5s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.5} }

    .stats {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 1px; background: #2d3748;
      border-bottom: 1px solid #2d3748;
    }
    .stat {
      background: #1a1f2e; padding: 12px 8px; text-align: center;
    }
    .stat-sayi { font-size: 22px; font-weight: 700; color: #63b3ed; }
    .stat-etiket { font-size: 10px; color: #718096; margin-top: 2px; }

    .bolum { padding: 12px 14px; border-bottom: 1px solid #1a1f2e; }
    .bolum-baslik {
      font-size: 10px; font-weight: 600; color: #718096;
      text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px;
    }

    .buton {
      width: 100%; padding: 9px 14px; border-radius: 8px;
      border: none; cursor: pointer; font-size: 13px; font-weight: 600;
      transition: opacity .15s;
    }
    .buton:hover { opacity: .85; }
    .buton:disabled { opacity: .4; cursor: default; }
    .buton-yesil  { background: #276749; color: #c6f6d5; }
    .buton-kirmizi { background: #742a2a; color: #fed7d7; }
    .buton-mavi   { background: #1a365d; color: #bee3f8; }
    .buton-gri    { background: #2d3748; color: #a0aec0; }

    .buton-grup { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

    .log-liste {
      max-height: 160px; overflow-y: auto;
      scrollbar-width: thin; scrollbar-color: #4a5568 transparent;
    }
    .log-satir {
      display: flex; align-items: flex-start; gap: 6px;
      padding: 5px 0; border-bottom: 1px solid #1a1f2e;
      font-size: 11.5px; line-height: 1.4;
    }
    .log-satir:last-child { border-bottom: none; }
    .log-zaman { color: #4a5568; font-size: 10px; min-width: 38px; }
    .log-ikon { font-size: 11px; min-width: 14px; }
    .log-mesaj { color: #cbd5e0; word-break: break-word; }
    .log-mesaj.ok    { color: #68d391; }
    .log-mesaj.hata  { color: #fc8181; }
    .log-mesaj.info  { color: #90cdf4; }

    .bos-log { text-align: center; color: #4a5568; padding: 24px 0; }

    .ayar-link {
      display: block; text-align: center; padding: 10px;
      color: #718096; font-size: 11px; text-decoration: none;
    }
    .ayar-link:hover { color: #a0aec0; }

    .uyari {
      background: #2d1f07; border: 1px solid #744210;
      border-radius: 6px; padding: 8px 10px; color: #f6ad55; font-size: 11.5px;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">EmlakRadar <span>GPT</span></div>
  <div class="badge" id="durum-badge">Yükleniyor...</div>
</div>

<div class="stats">
  <div class="stat">
    <div class="stat-sayi" id="stat-bekleyen">0</div>
    <div class="stat-etiket">Kuyrukta</div>
  </div>
  <div class="stat">
    <div class="stat-sayi" id="stat-tamamlanan">0</div>
    <div class="stat-etiket">Tamamlanan</div>
  </div>
  <div class="stat">
    <div class="stat-sayi" id="stat-toplam">0</div>
    <div class="stat-etiket">Toplam İşlendi</div>
  </div>
</div>

<!-- Uyarı (ayar eksikse) -->
<div id="uyari-alan" class="bolum" style="display:none">
  <div class="uyari" id="uyari-metin"></div>
</div>

<!-- Kuyruk kontrol -->
<div class="bolum">
  <div class="bolum-baslik">Kuyruk</div>
  <div class="buton-grup">
    <button class="buton buton-yesil" id="btn-baslat">▶ Başlat</button>
    <button class="buton buton-kirmizi" id="btn-durdur" disabled>⏹ Durdur</button>
  </div>
  <div style="margin-top: 6px">
    <button class="buton buton-gri" id="btn-temizle" style="font-size:11px; padding:6px">
      🗑 Kuyruğu Temizle
    </button>
  </div>
</div>

<!-- Log -->
<div class="bolum">
  <div class="bolum-baslik">Son İşlemler</div>
  <div class="log-liste" id="log-liste">
    <div class="bos-log">Henüz işlem yok</div>
  </div>
</div>

<a href="#" class="ayar-link" id="ayarlar-link">⚙ Ayarlar (API Key, Webhook)</a>

<script src="popup.js"></script>
</body>
</html>
